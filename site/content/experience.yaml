# Newest first. An org with more than one entry in `roles` renders as a
# promotion inside a single block rather than as two separate jobs.
#
# `*Zh` fields are the Chinese rendering. Company names stay in English, as do
# library and framework names; role titles, bullets and locations are
# translated. tools/check-i18n.mjs fails the build if one is missing.
