bio: >
  I'm a research tech lead at Meshy, working on 3D foundation models and the future of
  3D generative tooling. I hold a master's in EECS from UC Berkeley and a bachelor's in
  Computer Science from Tsinghua University. My work sits where computer graphics meets
  3D vision — reconstructing real scenes accurately enough to be useful, and generating
  new ones that hold up under scrutiny.
bioZh: >
  我是 Meshy 的研究技术负责人，方向是三维基础模型与下一代三维生成工具。
  我在加州大学伯克利分校取得 EECS 硕士学位，在清华大学取得计算机科学学士学位。
  我的工作处在计算机图形学与三维视觉的交叉处——把真实场景重建到足以实用的精度，
  也生成经得起细看的新场景。
