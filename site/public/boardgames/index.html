<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTT和PPT的桌游小屋</title>
<meta name="description" content="我们收的桌游都在这儿了。按人数和时长挑一款，或者让骰子替你决定。">
<!-- Unlisted on purpose: this is for friends, not for search results. -->
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="TTT和PPT的桌游小屋">
<meta property="og:description" content="我们收的桌游都在这儿了。按人数和时长挑一款，或者让骰子替你决定。">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --wood:#23180f; --wood-2:#2d2014; --felt:#2e6b52;
  --card:#fdf3e0; --card-2:#f0dfc0; --ink:#2a1a10;
  --gold:#f7b733; --gold-lit:#ffd166; --coral:#ef6b4a;
  --teal:#3aa7a0; --purple:#8b6fc9;
  --muted:#7d6549;
  /* Latin glyphs resolve from Baloo 2; CJK falls through to ZCOOL KuaiLe,
     which has no Latin coverage. One stack, both scripts, correct each way. */
  --display:'Baloo 2','ZCOOL KuaiLe',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --lift:0 6px 0 var(--ink),0 14px 22px rgba(0,0,0,.34);
  --lift-hi:0 11px 0 var(--ink),0 20px 30px rgba(0,0,0,.4);
  --lift-lo:0 2px 0 var(--ink),0 6px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; font-family:var(--body); color:var(--card);
  background:var(--wood);
  background-image:
    radial-gradient(circle at 50% 0,rgba(247,183,51,.16),transparent 62%),
    radial-gradient(circle,rgba(255,255,255,.045) 1.7px,transparent 1.8px);
  background-size:auto,30px 30px;
  background-attachment:fixed,fixed;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------------------------------------------------------------- shell */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 72px}
@media(min-width:720px){.wrap{padding:0 28px 96px}}

/* ---------------------------------------------------------------- header */
header{padding:34px 0 20px;text-align:center;position:relative}
.sign{
  display:inline-block;padding:18px 30px 20px;
  background:linear-gradient(180deg,#6b4423,#4a2d16);
  border:4px solid var(--ink);border-radius:20px;
  box-shadow:var(--lift);transform:rotate(-1deg);
}
h1{
  margin:0;font-family:var(--display);font-weight:800;
  font-size:clamp(1.65rem,6.4vw,3rem);line-height:1.18;letter-spacing:.01em;
  color:var(--gold-lit);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
}
.tagline{margin:10px 0 0;font-size:.86rem;color:#e6d3b4;opacity:.92}
.counter{
  display:inline-block;margin-top:14px;padding:5px 16px;font-size:.8rem;font-weight:600;
  background:var(--felt);border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 3px 0 var(--ink);transform:rotate(1.4deg);
}
.lang{
  position:absolute;top:34px;right:0;
  padding:7px 15px;font-family:var(--display);font-weight:700;font-size:.82rem;
  background:var(--card);color:var(--ink);
  border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);
  transition:transform .14s,box-shadow .14s;
}
.lang:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.lang:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ---------------------------------------------------------------- controls */
.controls{
  background:rgba(46,107,82,.34);border:3px solid rgba(42,26,16,.6);
  border-radius:20px;padding:14px;margin:8px 0 26px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:11px}
.row:last-child{margin-bottom:0}
.row-label{
  font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--gold-lit);
  min-width:44px;flex-shrink:0;text-align:left;
}
button.row-label{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.row.collapsed .chips{display:none}
.caret{display:inline-block;transition:transform .16s}
.row.collapsed .caret{transform:rotate(-90deg)}
/* On a phone the three filter rows ate the whole first screen; the two
   primary ones scroll sideways instead of wrapping, and tags start folded. */
@media(max-width:719px){
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chips.scroll .chip{flex-shrink:0}
}
.chip{
  padding:5px 13px;font-size:.8rem;font-weight:600;
  background:rgba(253,243,224,.14);color:var(--card);
  border:2px solid rgba(42,26,16,.55);border-radius:999px;
  transition:transform .12s,background .12s,color .12s;
}
.chip:hover{transform:translateY(-1px);background:rgba(253,243,224,.26)}
.chip[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.chip.tag[aria-pressed=true]{background:var(--teal);color:#08201c}
.search{
  flex:1;min-width:150px;padding:7px 14px;font-family:var(--body);font-size:.82rem;
  background:rgba(253,243,224,.14);color:var(--card);
  border:2px solid rgba(42,26,16,.55);border-radius:999px;outline:none;
}
.search::placeholder{color:rgba(253,243,224,.55)}
.search:focus{border-color:var(--gold);background:rgba(253,243,224,.22)}
.dice{
  padding:8px 20px;font-family:var(--display);font-weight:800;font-size:.92rem;
  background:var(--coral);color:#fff;
  border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;white-space:nowrap;
}
.dice:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.dice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.dice .pip{display:inline-block;margin-right:5px}
.dice.rolling .pip{animation:roll .5s linear}
@keyframes roll{to{transform:rotate(360deg) scale(1.25)}}
.reset{font-size:.76rem;color:#e6d3b4;text-decoration:underline;opacity:.8}

/* ---------------------------------------------------------------- grid */
.grid{
  position:relative;display:block;
}
/* Waterfall, the way Rednote does it: one column width for everything, and the
   height of each card falls out of its cover's real aspect ratio plus however
   much text it carries. layout() places each slot into the shortest column. */
.slot{
  position:absolute;top:0;left:0;
  transition:transform .34s cubic-bezier(.2,.8,.3,1),opacity .22s ease-out;
  will-change:transform;
}
.slot:hover{z-index:2}
.card{
  width:100%;display:flex;flex-direction:column;text-align:left;
  background:var(--card);color:var(--ink);
  border:3px solid var(--ink);border-radius:18px;overflow:hidden;
  box-shadow:var(--lift);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s;
}
.card:hover{transform:translateY(-5px);box-shadow:var(--lift-hi)}
.card:active{transform:translateY(2px);box-shadow:var(--lift-lo)}
.card.flash{animation:flash 1.1s ease-out}
@keyframes flash{
  0%,100%{box-shadow:var(--lift)}
  22%,62%{box-shadow:0 0 0 6px var(--gold),0 11px 0 var(--ink),0 20px 30px rgba(0,0,0,.4)}
}
.shot{position:relative;width:100%;background:var(--card-2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover}
.ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:2.2rem;color:rgba(255,255,255,.92);
  text-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center;padding:8px;line-height:1.1;
}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{
  font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.25;
  margin:0;overflow-wrap:anywhere;
}
.sub{font-size:.68rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.stat{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;font-size:.7rem;font-weight:700;
  background:var(--card-2);border:2px solid var(--ink);border-radius:999px;white-space:nowrap;
}
.stat svg{width:11px;height:11px;flex-shrink:0}
.blurb{font-size:.78rem;line-height:1.5;color:#4a3524;margin:0}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.t{
  padding:2px 8px;font-size:.64rem;font-weight:700;border-radius:999px;
  background:var(--teal);color:#08201c;
}
.empty{
  padding:46px 16px;text-align:center;
  font-family:var(--display);font-size:1.05rem;color:#e6d3b4;opacity:.85;
}

/* ---------------------------------------------------------------- modal */
.overlay{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:16px;
  background:rgba(12,8,4,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.overlay.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(560px,100%);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);color:var(--ink);
  border:4px solid var(--ink);border-radius:22px;box-shadow:0 12px 0 var(--ink),0 30px 60px rgba(0,0,0,.55);
  animation:pop .24s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.sheet .shot{aspect-ratio:16/10;border-bottom:3px solid var(--ink);border-radius:0}
.sheet-body{padding:16px 18px 22px;display:flex;flex-direction:column;gap:11px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.22}
.sheet .sub{font-size:.8rem}
.sheet p{margin:0;font-size:.9rem;line-height:1.62;color:#3d2b1c}
.note{
  padding:10px 13px;font-size:.82rem;line-height:1.55;
  background:var(--card-2);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;
}
.extras{display:flex;flex-wrap:wrap;gap:6px}
.extra{padding:3px 11px;font-size:.74rem;font-weight:700;background:var(--purple);color:#fff;border-radius:999px}
.close{
  align-self:flex-start;margin-top:4px;padding:7px 20px;
  font-family:var(--display);font-weight:700;font-size:.88rem;
  background:var(--ink);color:var(--card);border-radius:999px;
  transition:transform .12s;
}
.close:active{transform:translateY(2px)}

footer{padding:26px 0 0;text-align:center;font-size:.74rem;color:#b9a888;opacity:.75}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .slot{transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="lang" id="lang" type="button"></button>
    <div class="sign">
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div><span class="counter" id="counter"></span></div>
  </header>

  <div class="controls">
    <div class="row"><span class="row-label" id="l-players"></span><span class="chips scroll" id="f-players"></span></div>
    <div class="row"><span class="row-label" id="l-time"></span><span class="chips scroll" id="f-time"></span></div>
    <div class="row" id="row-tags"><button class="row-label" id="l-tags" type="button" aria-expanded="true"></button><span class="chips" id="f-tags"></span></div>
    <div class="row">
      <input class="search" id="q" type="search" autocomplete="off">
      <button class="dice" id="dice" type="button"><span class="pip">🎲</span><span id="dice-label"></span></button>
      <button class="reset" id="reset" type="button"></button>
    </div>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden></p>
  <footer id="footer"></footer>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------ UI strings */
var UI = {
  zh:{
    htmlLang:'zh-CN',
    title:'TTT和PPT的桌游小屋',
    tagline:'我们家里这些盒子，随时欢迎你来开一局。',
    counter:function(n){return '共 '+n+' 款桌游'},
    shown:function(n,t){return n===t ? '共 '+t+' 款桌游' : '筛出 '+n+' 款 / 共 '+t+' 款'},
    players:'人数', time:'时长', tags:'标签',
    any:'不限', quick:'快速局', medium:'中等', long:'长局',
    search:'搜名字、搜标签…', dice:'今晚玩什么？', reset:'清除筛选',
    empty:'这个条件下没有合适的，换一个试试？',
    min:'分钟', flexible:'时长自定', plus:'人以上',
    aka:'又名', contains:'包含内容', close:'关闭',
    footer:'TTT & PPT 的桌游小屋 · 想来玩随时说一声',
    langBtn:'EN'
  },
  en:{
    htmlLang:'en',
    title:"TTT & PPT's Board Game Cabin",
    tagline:'Every box on our shelf. Come over and we’ll play one.',
    counter:function(n){return n+' games'},
    shown:function(n,t){return n===t ? t+' games' : n+' of '+t+' games'},
    players:'Players', time:'Length', tags:'Tags',
    any:'Any', quick:'Quick', medium:'Medium', long:'Long',
    search:'Search names and tags…', dice:'What should we play?', reset:'Clear filters',
    empty:'Nothing matches that. Try loosening a filter?',
    min:'min', flexible:'as long as you like', plus:'+',
    aka:'Also known as', contains:'What’s inside', close:'Close',
    footer:'TTT & PPT’s board game cabin · ask us any time',
    langBtn:'中文'
  }
};

var PLAYER_STOPS = [2,3,4,5,6,7,8,9,10,12,16];
var TIME_BANDS = {quick:[0,20], medium:[21,60], long:[61,9999]};

var DATA=null, CARDS={}, TAGS={};
var state={lang:'zh', players:null, time:null, tags:{}, q:''};

/* ------------------------------------------------------------ helpers */
function t(){return UI[state.lang]}
function L(o){ if(!o) return ''; return o[state.lang] || o.en || o.zh || ''; }
function other(o){ return state.lang==='zh' ? (o.en||'') : (o.zh||''); }
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function timeText(g){
  if(!g.time) return t().flexible;
  var a=g.time[0], b=g.time[1];
  return (a===b? a : a+'–'+b) + ' ' + t().min;
}
function playerText(g){
  var a=g.players[0], b=g.players[1];
  return a===b ? String(a) : a+'–'+b;
}
var ICON_P='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.4"/><path d="M1.6 13.4c0-2.4 2-3.8 4.4-3.8s4.4 1.4 4.4 3.8"/><path d="M11 3.2a2.2 2.2 0 0 1 0 4.2M12.2 9.9c1.4.5 2.4 1.7 2.4 3.5"/></svg>';
var ICON_T='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5.4"/><path d="M8 6v3.2l2 1.4M6 1.4h4"/></svg>';

/* ------------------------------------------------------------ filtering */
function matches(g){
  if(state.players!=null){
    var n=state.players;
    if(n===16){ if(g.players[1]<16) return false; }
    else if(n<g.players[0] || n>g.players[1]) return false;
  }
  if(state.time){
    var band=TIME_BANDS[state.time];
    if(!g.time){ if(state.time!=='long') return false; }   // open-ended = a long session
    else { var mid=(g.time[0]+g.time[1])/2; if(mid<band[0]||mid>band[1]) return false; }
  }
  var picked=Object.keys(state.tags).filter(function(k){return state.tags[k]});
  for(var i=0;i<picked.length;i++){ if(g.tags.indexOf(picked[i])<0) return false; }
  if(state.q){
    var hay=[g.name.zh,g.name.en,L(g.blurb),L(g.desc),g.alt?L(g.alt):'' ]
      .concat(g.tags.map(function(k){return TAGS[k].zh+' '+TAGS[k].en}))
      .join(' ').toLowerCase();
    if(hay.indexOf(state.q.toLowerCase())<0) return false;
  }
  return true;
}

/* ------------------------------------------------------------ cards */
function placeholder(g){
  var d=el('div','ph');
  var hue=hash(g.id)%360;
  d.style.background='linear-gradient(150deg,hsl('+hue+',52%,46%),hsl('+((hue+38)%360)+',56%,32%))';
  d.textContent=(g.name.zh||g.name.en).slice(0,2);
  return d;
}
function buildCard(g){
  var slot=el('div','slot'); slot.dataset.id=g.id;
  var c=el('button','card'); c.type='button'; c.dataset.id=g.id;

  var shot=el('div','shot');
  // Set from the cover's real dimensions, so the box art is never cropped and
  // the card's height is known before the image has loaded -- no reflow.
  shot.style.aspectRatio=String(g.coverAspect||0.78);
  var img=new Image();
  img.loading='lazy'; img.decoding='async'; img.alt='';
  img.src=g.cover;
  img.onerror=function(){ shot.replaceChildren(placeholder(g)); };
  shot.appendChild(img);
  c.appendChild(shot);

  var b=el('div','body');
  b.appendChild(el('h3','name'));
  b.appendChild(el('p','sub'));
  b.appendChild(el('p','blurb'));
  b.appendChild(el('div','tagrow'));
  var st=el('div','stats');
  var s1=el('span','stat'); s1.innerHTML=ICON_P; s1.appendChild(el('span'));
  var s2=el('span','stat'); s2.innerHTML=ICON_T; s2.appendChild(el('span'));
  st.appendChild(s1); st.appendChild(s2);
  b.appendChild(st);
  c.appendChild(b);

  c.addEventListener('click',function(){ openSheet(g); });
  slot.appendChild(c);
  return slot;
}
function fillCard(c,g){
  c.querySelector('.name').textContent=L(g.name);
  c.querySelector('.sub').textContent=other(g.name);
  c.querySelector('.blurb').textContent=L(g.blurb);
  var tr=c.querySelector('.tagrow'); tr.replaceChildren();
  g.tags.slice(0,3).forEach(function(k){ tr.appendChild(el('span','t',L(TAGS[k]))); });
  var st=c.querySelectorAll('.stat span');
  st[0].textContent=playerText(g);
  st[1].textContent=timeText(g);
  c.setAttribute('aria-label', L(g.name)+' — '+playerText(g));
}

/* ------------------------------------------------------------ render */
var grid=document.getElementById('grid'), emptyEl=document.getElementById('empty');

function render(animate){
  var list=DATA.games.filter(matches);
  list.forEach(function(g){ fillCard(CARDS[g.id].firstChild, g); });
  document.getElementById('counter').textContent=t().shown(list.length, DATA.games.length);
  emptyEl.textContent=t().empty;
  emptyEl.hidden=!!list.length;
  layout(animate, list);
}

/* Shortest-column packing. Reading offsetHeight per card forces a sync layout,
   which is the price of measuring text that has already wrapped -- at this many
   cards it is not worth a smarter scheme. */
function layout(animate, list){
  if(!DATA) return;
  list = list || DATA.games.filter(matches);
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var W=grid.clientWidth; if(W<=0) return;
  var gap = W<640 ? 12 : 18;
  var cols = Math.max(2, Math.min(6, Math.round(W/232)));
  var colW = Math.floor((W - gap*(cols-1))/cols);
  var h=[], i; for(i=0;i<cols;i++) h.push(0);

  var shown={};
  list.forEach(function(g){ shown[g.id]=1; });
  DATA.games.forEach(function(g){
    if(!shown[g.id]){ var s=CARDS[g.id]; s.style.display='none'; s.dataset.on='0'; }
  });

  list.forEach(function(g){
    var s=CARDS[g.id];
    var entering = s.dataset.on!=='1';
    s.style.display=''; s.style.width=colW+'px';

    var c=0;
    for(var i=1;i<cols;i++) if(h[i] < h[c]-0.5) c=i;
    var x=c*(colW+gap), y=h[c];

    if(entering || !animate || reduce){
      // Jump into place without sliding in from wherever it last sat.
      s.style.transition='none';
      s.style.opacity = entering ? '0' : '1';
      s.style.transform='translate('+x+'px,'+y+'px)';
      void s.offsetWidth;
      s.style.transition='';
      s.style.opacity='1';
    } else {
      s.style.transform='translate('+x+'px,'+y+'px)';
    }
    s.dataset.on='1';
    h[c] = y + s.offsetHeight + gap;
  });

  grid.style.height = (list.length ? Math.max.apply(null,h)-gap : 0)+'px';
}

var rt;
window.addEventListener('resize',function(){
  clearTimeout(rt); rt=setTimeout(function(){ layout(false); },120);
});
// ZCOOL KuaiLe arrives after first paint and changes how titles wrap.
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ layout(false); });

/* ------------------------------------------------------------ modal */
var overlay=document.getElementById('overlay'), sheet=document.getElementById('sheet');
function openSheet(g){
  sheet.replaceChildren();
  var shot=el('div','shot');
  var img=new Image(); img.alt=''; img.decoding='async'; img.src=g.cover;
  img.onerror=function(){ shot.replaceChildren(placeholder(g)); };
  shot.appendChild(img); sheet.appendChild(shot);

  var b=el('div','sheet-body');
  b.appendChild(el('h2',null,L(g.name)));
  if(other(g.name)) b.appendChild(el('p','sub',other(g.name)));
  if(g.alt && L(g.alt)) b.appendChild(el('p','sub',t().aka+' · '+L(g.alt)));

  var st=el('div','stats');
  var s1=el('span','stat'); s1.innerHTML=ICON_P; s1.appendChild(el('span',null,playerText(g)));
  var s2=el('span','stat'); s2.innerHTML=ICON_T; s2.appendChild(el('span',null,timeText(g)));
  st.appendChild(s1); st.appendChild(s2); b.appendChild(st);

  var tr=el('div','extras');
  g.tags.forEach(function(k){ tr.appendChild(el('span','t',L(TAGS[k]))); });
  b.appendChild(tr);

  b.appendChild(el('p',null,L(g.desc)));
  if(g.playersNote && L(g.playersNote)) b.appendChild(el('div','note',L(g.playersNote)));
  if(g.notes && L(g.notes)) b.appendChild(el('div','note',L(g.notes)));
  if(g.extras && g.extras.length){
    b.appendChild(el('p','sub',t().contains));
    var ex=el('div','extras');
    g.extras.forEach(function(e){ ex.appendChild(el('span','extra',L(e))); });
    b.appendChild(ex);
  }
  var cl=el('button','close',t().close); cl.type='button';
  cl.addEventListener('click',closeSheet); b.appendChild(cl);

  sheet.appendChild(b);
  overlay.classList.add('on');
  document.body.style.overflow='hidden';
  try{ history.pushState({sheet:1},''); }catch(e){}
  cl.focus();
}
function closeSheet(fromPop){
  if(!overlay.classList.contains('on')) return;
  overlay.classList.remove('on');
  document.body.style.overflow='';
  if(!fromPop){ try{ if(history.state&&history.state.sheet) history.back(); }catch(e){} }
}
overlay.addEventListener('click',function(e){ if(e.target===overlay) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
window.addEventListener('popstate',function(){ closeSheet(true); });

/* ------------------------------------------------------------ controls */
function chipRow(host, items, isActive, onPick, cls){
  host.replaceChildren();
  items.forEach(function(it){
    var b=el('button','chip'+(cls?' '+cls:''), it.label);
    b.type='button';
    b.setAttribute('aria-pressed', isActive(it.value) ? 'true':'false');
    b.addEventListener('click',function(){ onPick(it.value); });
    host.appendChild(b);
  });
}
function buildControls(){
  var pItems=[{value:null,label:t().any}].concat(PLAYER_STOPS.map(function(n){
    return {value:n, label: n===16 ? (state.lang==='zh' ? '16'+t().plus : '16'+t().plus) : String(n)};
  }));
  chipRow(document.getElementById('f-players'), pItems,
    function(v){return state.players===v},
    function(v){ state.players = (state.players===v ? null : v); buildControls(); render(true); });

  chipRow(document.getElementById('f-time'), [
    {value:null,label:t().any},
    {value:'quick',label:t().quick+' ≤ 20'},
    {value:'medium',label:t().medium+' 20–60'},
    {value:'long',label:t().long+' 60+'}
  ], function(v){return state.time===v},
     function(v){ state.time = (state.time===v ? null : v); buildControls(); render(true); });

  chipRow(document.getElementById('f-tags'),
    Object.keys(TAGS).map(function(k){ return {value:k,label:L(TAGS[k])}; }),
    function(v){return !!state.tags[v]},
    function(v){ state.tags[v]=!state.tags[v]; buildControls(); render(true); },
    'tag');
}

function applyLang(){
  var s=t();
  document.documentElement.lang=s.htmlLang;
  document.title=s.title;
  document.getElementById('title').textContent=s.title;
  document.getElementById('tagline').textContent=s.tagline;
  document.getElementById('l-players').textContent=s.players;
  document.getElementById('l-time').textContent=s.time;
  document.getElementById('l-tags').innerHTML=s.tags+' <span class="caret">\u25be</span>';
  document.getElementById('q').placeholder=s.search;
  document.getElementById('dice-label').textContent=s.dice;
  document.getElementById('reset').textContent=s.reset;
  document.getElementById('lang').textContent=s.langBtn;
  document.getElementById('footer').textContent=s.footer;
  buildControls();
  render(false);
}

/* ------------------------------------------------------------ dice */
document.getElementById('dice').addEventListener('click',function(){
  var btn=this;
  var list=DATA.games.filter(matches);
  if(!list.length) return;
  btn.classList.add('rolling');
  setTimeout(function(){
    btn.classList.remove('rolling');
    var g=list[Math.floor(Math.random()*list.length)];
    var s=CARDS[g.id], c=s.firstChild;
    s.scrollIntoView({behavior:'smooth',block:'center'});
    c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
    setTimeout(function(){ openSheet(g); }, 620);
  }, 520);
});

document.getElementById('reset').addEventListener('click',function(){
  state.players=null; state.time=null; state.tags={}; state.q='';
  document.getElementById('q').value='';
  buildControls(); render(true);
});

var qt;
document.getElementById('q').addEventListener('input',function(e){
  var v=e.target.value;
  clearTimeout(qt);
  qt=setTimeout(function(){ state.q=v.trim(); render(true); },160);
});

var rowTags=document.getElementById('row-tags');
if(window.innerWidth<720) rowTags.classList.add('collapsed');
document.getElementById('l-tags').addEventListener('click',function(){
  var folded=rowTags.classList.toggle('collapsed');
  this.setAttribute('aria-expanded', folded?'false':'true');
});

document.getElementById('lang').addEventListener('click',function(){
  state.lang = state.lang==='zh' ? 'en' : 'zh';
  try{ localStorage.setItem('bg-lang', state.lang); }catch(e){}
  applyLang();
});

/* ------------------------------------------------------------ boot */
try{
  var saved=localStorage.getItem('bg-lang');
  if(saved==='zh'||saved==='en') state.lang=saved;
  else if(!/^zh/i.test(navigator.language||'')) state.lang='en';
}catch(e){}

fetch('games.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
  DATA=d; TAGS=d.tags;
  d.games.forEach(function(g){ CARDS[g.id]=buildCard(g); grid.appendChild(CARDS[g.id]); });
  applyLang();
}).catch(function(err){
  emptyEl.hidden=false; emptyEl.textContent='games.json 没能加载 · '+err;
});
})();
</script>
</body>
</html>
